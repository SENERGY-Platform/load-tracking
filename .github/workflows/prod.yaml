name: 'PROD build'

# master builds :prod as before plus :vX.Y.Z; a release/vN branch keeps an older major
# alive and builds only its :vN.x.y. The git tag is pushed after the image, so a failed
# build never consumes a version.
on:
  push:
    branches:
      - master
      - 'release/v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Computes the version only; the git tag is pushed by the tag job once the image exists.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "tag=$(.github/scripts/next-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under every tag below.
  multi:
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      # The build context is the Git repository at the pushed commit, which leaves out
      # .git unless asked to keep it. The Dockerfile reads the commit from it.
      build-args: |
        BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
      meta-images: |
        ghcr.io/senergy-platform/load-tracking
      meta-tags: |
        type=raw,value=${{ needs.version.outputs.tag }}
        type=raw,value=prod,enable=${{ github.ref_name == 'master' }}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

  tag:
    needs: [version, multi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push version tag
        run: |
          tag='${{ needs.version.outputs.tag }}'
          if [ -z "$(git tag --points-at HEAD --list "$tag")" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
